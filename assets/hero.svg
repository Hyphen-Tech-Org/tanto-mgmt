<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Yu Gothic UI','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eaf0f6"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2545" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="440" rx="24" fill="url(#bgGrad)"/>

  <!-- LEFT: title, tagline, chips -->
  <g>
    <text x="80" y="150" font-size="64" font-weight="800" fill="#0b2545">🕒 Analog Clock</text>
    <text x="82" y="200" font-size="24" font-weight="500" fill="#33475b">A tiny, portable, always-on-top desktop clock for Windows — zero install.</text>

    <!-- feature chips -->
    <g font-size="20" font-weight="700">
      <!-- Zero install -->
      <rect x="80" y="250" width="150" height="48" rx="24" fill="#0b2545"/>
      <text x="155" y="280" text-anchor="middle" fill="#ffffff">Zero install</text>
      <!-- tkinter only -->
      <rect x="246" y="250" width="156" height="48" rx="24" fill="#0b2545"/>
      <text x="324" y="280" text-anchor="middle" fill="#ffffff">tkinter only</text>
      <!-- Always on top -->
      <rect x="418" y="250" width="176" height="48" rx="24" fill="#0b2545"/>
      <text x="506" y="280" text-anchor="middle" fill="#ffffff">Always on top</text>
      <!-- Pomodoro -->
      <rect x="610" y="250" width="140" height="48" rx="24" fill="#0b2545"/>
      <text x="680" y="280" text-anchor="middle" fill="#ffffff">Pomodoro</text>
    </g>
  </g>

  <!-- RIGHT: clock illustration (reused, scaled) -->
  <g transform="translate(940,30) scale(1.5)" filter="url(#softShadow)">
    <!-- Face -->
    <circle cx="120" cy="120" r="118" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

    <!-- 12 hour ticks -->
    <g stroke="#222222" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(0 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(30 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(60 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(90 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(120 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(150 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(180 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(210 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(240 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(270 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(300 120 120)"/>
      <line x1="120" y1="14" x2="120" y2="30" transform="rotate(330 120 120)"/>
    </g>

    <!-- Pomodoro count -->
    <text x="120" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#666666">Today: 3</text>

    <!-- Digital time -->
    <text x="120" y="86" text-anchor="middle" font-size="22" font-weight="700" fill="#000000">10:08:42</text>

    <!-- Hands at 10:08:42 -->
    <line x1="120" y1="120" x2="73.6" y2="88.7" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="183.7" y2="70.6" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="34.8" y2="147.7" stroke="#D00000" stroke-width="2" stroke-linecap="round"/>

    <!-- center dot -->
    <circle cx="120" cy="120" r="5" fill="#000000"/>

    <!-- Date -->
    <text x="120" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#000000">Mon 1 Jun 2026</text>
  </g>
</svg>
