<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#09090b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Face: white disc with zinc-300 ring (Light / default theme) -->
  <g filter="url(#ds)">
    <circle cx="130" cy="128" r="112" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  </g>

  <!-- Hour ticks every 30deg -->
  <g stroke="#18181b" stroke-width="3" stroke-linecap="round">
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(0 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(30 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(60 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(90 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(120 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(150 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(180 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(210 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(240 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(270 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(300 130 128)"/>
    <line x1="130" y1="28" x2="130" y2="42" transform="rotate(330 130 128)"/>
  </g>

  <!-- Today counter -->
  <text x="130" y="56" text-anchor="middle" font-size="11" fill="#a1a1aa">Today: 3</text>

  <!-- Digital time -->
  <text x="130" y="82" text-anchor="middle" font-size="22" font-weight="700" fill="#09090b">10:08:42</text>

  <!-- Hands at 10:08:42, center (130,128) -->
  <line x1="130" y1="128" x2="84" y2="93" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="128" x2="181" y2="73" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="128" x2="41" y2="148" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="130" cy="128" r="5" fill="#09090b"/>

  <!-- Date -->
  <text x="130" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#71717a">Mon 1 Jun 2026</text>
</svg>
